<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Centro Fondo Schilpario</title>

<meta name="theme-color" content="#0d1b2a">

<link rel="manifest" href="/static/manifest.json">

<link rel="apple-touch-icon"
      href="/static/logo-512.png">

<style>

body{
    margin:0;
    background:#0d1b2a;
    font-family:Arial,sans-serif;
    color:white;
}

.container{
    max-width:400px;
    margin:80px auto;
    padding:20px;
}

.card{
    background:#1b263b;
    padding:25px;
    border-radius:12px;
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    text-align:center;
    margin-top:10px;
    margin-bottom:5px;
}

.sottotitolo{
    text-align:center;
    color:#c7d3df;
    margin-bottom:20px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    font-size:18px;
    border:none;
    border-radius:8px;
    margin-top:15px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:8px;
    background:#2ecc71;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#27ae60;
}

.errore{
    color:#ff6b6b;
    text-align:center;
    margin-top:12px;
}

.versione{
    text-align:center;
    margin-top:20px;
    color:#7d8794;
    font-size:12px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
🎿
</div>

<h1>Centro Fondo</h1>

<div class="sottotitolo">
Schilpario
</div>

<form method="post">

<input
type="password"
name="password"
placeholder="Password">

<button type="submit">
Accedi
</button>

</form>

{% if errore %}
<div class="errore">
{{ errore }}
</div>
{% endif %}

<div class="versione">
Pannello gestione piste
</div>

</div>

</div>

</body>

</html>
