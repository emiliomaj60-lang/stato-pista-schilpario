<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Accesso Admin</title>

<style>

body{
    margin:0;
    background:#0d1b2a;
    font-family:Arial,sans-serif;
    color:white;
}

.container{
    max-width:400px;
    margin:80px auto;
    padding:20px;
}

.card{
    background:#1b263b;
    padding:25px;
    border-radius:12px;
}

h1{
    text-align:center;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    font-size:18px;
    border:none;
    border-radius:8px;
    margin-top:15px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:8px;
    background:#2ecc71;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.errore{
    color:#ff6b6b;
    text-align:center;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🎿 Centro Fondo</h1>

<form method="post">

<input
type="password"
name="password"
placeholder="Password">

<button type="submit">
Accedi
</button>

</form>

{% if errore %}
<div class="errore">
{{ errore }}
</div>
{% endif %}

</div>

</div>

</body>

</html>
