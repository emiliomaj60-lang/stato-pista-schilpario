<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Gestione Ticker</title>

<style>

body{
    background:#0d1b2a;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:#1b263b;
    padding:15px;
    border-radius:10px;
    margin-bottom:12px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

textarea{
    min-height:120px;
}

.btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:10px;
    background:#27ae60;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.preview{

    margin-top:10px;

    padding:15px;

    overflow:hidden;

    white-space:nowrap;

    border-radius:6px;

    font-size:28px;

    font-weight:bold;
}

.blink{

    animation: blink 1s infinite;
}

@keyframes blink{

    50%{
        opacity:0.4;
    }

}

</style>

</head>

<body>

<div class="container">

<form method="post">

<div class="card">

<label>Messaggio Ticker</label>

<textarea
name="ticker">{{ dati.get('ticker','') }}</textarea>

</div>

<div class="card">

<label>Colore Sfondo</label>

<input
type="color"
name="ticker_bg"
value="{{ dati.get('ticker_bg','#f39c12') }}">

</div>

<div class="card">

<label>Colore Testo</label>

<input
type="color"
name="ticker_fg"
value="{{ dati.get('ticker_fg','#000000') }}">

</div>

<div class="card">

<label>Velocità (secondi)</label>

<select name="ticker_speed">

<option value="10"
{% if dati.get('ticker_speed') == '10' %}selected{% endif %}>
Molto veloce
</option>

<option value="20"
{% if dati.get('ticker_speed','20') == '20' %}selected{% endif %}>
Media
</option>

<option value="30"
{% if dati.get('ticker_speed') == '30' %}selected{% endif %}>
Lenta
</option>

</select>

</div>

<div class="card">

<label>Lampeggio</label>

<select name="ticker_blink">

<option value="NO"
{% if dati.get('ticker_blink','NO') == 'NO' %}selected{% endif %}>
NO
</option>

<option value="SI"
{% if dati.get('ticker_blink') == 'SI' %}selected{% endif %}>
SI
</option>

</select>

</div>

<div class="card">

<label>Anteprima</label>

<div
class="preview {% if dati.get('ticker_blink') == 'SI' %}blink{% endif %}"
style="
background:{{ dati.get('ticker_bg','#f39c12') }};
color:{{ dati.get('ticker_fg','#000000') }};
">

{{ dati.get('ticker','') }}

</div>

</div>

<button
class="btn"
type="submit">

💾 SALVA TICKER

</button>



<a
href="/admin"
style="
display:block;
margin-top:15px;
padding:18px;
text-align:center;
background:#3498db;
color:white;
text-decoration:none;
border-radius:10px;
font-size:22px;
font-weight:bold;
">

⬅ TORNA ALLA GESTIONE PISTA

</a>

</form>

</div>

</body>

</html>
