<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestione Stato Pista</title>

<style>

body{
    background:#0d1b2a;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
    color:white;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
}

.card{
    background:#1b263b;
    padding:15px;
    border-radius:10px;
    margin-bottom:12px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input,
select,
textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:18px;
}

textarea{
    min-height:90px;
}

.btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:10px;
    font-size:22px;
    font-weight:bold;
    background:#27ae60;
    color:white;
    cursor:pointer;
}

.logout{
    display:block;
    margin-top:20px;
    text-align:center;
    color:white;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>🎿 Gestione Stato Pista</h1>

<form method="post">

<div class="card">
<label>Stato pista</label>

<select name="stato">

<option value="APERTA"
{% if dati.get('stato','APERTA') == 'APERTA' %}
selected
{% endif %}>
APERTA
</option>

<option value="CHIUSA"
{% if dati.get('stato','APERTA') == 'CHIUSA' %}
selected
{% endif %}>
CHIUSA
</option>

</select>
</div>

<div class="card">
<label>Modalità</label>

<select name="modalita">

<option value="AUTO"
{% if dati.get('modalita','AUTO') == 'AUTO' %}
selected
{% endif %}>
AUTO
</option>

<option value="FORZA_APERTA"
{% if dati.get('modalita','AUTO') == 'FORZA_APERTA' %}
selected
{% endif %}>
FORZA APERTA
</option>

<option value="FORZA_CHIUSA"
{% if dati.get('modalita','AUTO') == 'FORZA_CHIUSA' %}
selected
{% endif %}>
FORZA CHIUSA
</option>

</select>
</div>

<div class="card">
<label>Ora apertura</label>

<input
type="time"
name="ora_apertura"
value="{{ dati.get('ora_apertura','08:30') }}">
</div>

<div class="card">
<label>Ora chiusura</label>

<input
type="time"
name="ora_chiusura"
value="{{ dati.get('ora_chiusura','17:00') }}">
</div>

<div class="card">
<label>Km aperti</label>

<input
type="number"
name="km"
value="{{ dati.get('km','0') }}">
</div>

<div class="card">
<label>Temperatura aria</label>

<input
type="number"
name="temperatura_aria"
value="{{ dati.get('temperatura_aria','0') }}">
</div>

<div class="card">
<label>Temperatura neve</label>

<input
type="number"
name="temperatura_neve"
value="{{ dati.get('temperatura_neve','0') }}">
</div>

<div class="card">
<label>Ora battitura</label>

<div class="card">

<button
type="button"
class="btn"
onclick="impostaAdesso()">

🕒 ADESSO

</button>

</div>

<input
type="text"
name="ultima_battitura"
value="{{ dati.get('ultima_battitura','06:30') }}">
</div>

<div class="card">
<label>Data battitura</label>

<input
type="text"
name="data_battitura"
value="{{ dati.get('data_battitura','') }}">
</div>

<div class="card">
<label>Note</label>

<textarea
name="note">{{ dati.get('note','') }}</textarea>
</div>

<button class="btn" type="submit">
💾 SALVA
</button>

</form>

<a class="logout" href="/logout">
🚪 Logout
</a>

</div>

<script>

function impostaAdesso() {

    const adesso = new Date();

    const ore =
        String(adesso.getHours()).padStart(2, "0");

    const minuti =
        String(adesso.getMinutes()).padStart(2, "0");

    const giorno =
        String(adesso.getDate()).padStart(2, "0");

    const mese =
        String(adesso.getMonth() + 1).padStart(2, "0");

    const anno =
        adesso.getFullYear();

    document.querySelector(
        'input[name="ultima_battitura"]'
    ).value =
        ore + ":" + minuti;

    document.querySelector(
        'input[name="data_battitura"]'
    ).value =
        giorno + "/" + mese + "/" + anno;
}

</script>

</body>
</html>
