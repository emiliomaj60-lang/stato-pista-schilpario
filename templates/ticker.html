<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:{{ dati.get('ticker_bg','#f39c12') }};

    font-family:Arial,sans-serif;
}

.ticker{

    width:100%;
    height:100%;

    display:flex;

    align-items:center;

    overflow:hidden;

    white-space:nowrap;
}

.testo{

    font-size:36px;

    font-weight:bold;

    color:{{ dati.get('ticker_fg','#000000') }};

    padding-left:100%;

    animation:
        scorri {{ dati.get('ticker_speed','20') }}s linear infinite;
}

@keyframes scorri{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

.lampeggio{
    animation:
        scorri var(--velocita) linear infinite,
        blink 1s infinite;
}

.pulsazione{
    animation:
        scorri var(--velocita) linear infinite,
        pulse 1.2s infinite;
}

.zoom{
    animation:
        scorri var(--velocita) linear infinite,
        zoom 1.5s infinite;
}

.emergenza{
    animation:
        scorri var(--velocita) linear infinite,
        emergency 0.8s infinite;
}

@keyframes blink{

    50%{
        opacity:0.3;
    }

}

@keyframes pulse{

    50%{
        transform:scale(1.08);
    }

}

@keyframes zoom{

    50%{
        transform:scale(1.2);
    }

}

@keyframes emergency{

    0%{
        opacity:1;
    }

    50%{
        opacity:0.1;
    }

    100%{
        opacity:1;
    }

}
</style>

</head>

<body>

<div class="ticker">

    <div
    class="
    testo
    {% if dati.get('ticker_animazione') == 'LAMPEGGIO' %}lampeggio{% endif %}
    {% if dati.get('ticker_animazione') == 'PULSAZIONE' %}pulsazione{% endif %}
    {% if dati.get('ticker_animazione') == 'ZOOM' %}zoom{% endif %}
    {% if dati.get('ticker_animazione') == 'EMERGENZA' %}emergenza{% endif %}
    "
    style="
    --velocita:{{ dati.get('ticker_speed','20') }}s;
    ">

        {{ dati.get('ticker','') }}

    </div>

</div>

</body>

</html>
