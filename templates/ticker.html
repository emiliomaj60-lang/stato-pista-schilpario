<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial,sans-serif;
}

/* SFONDI */

body{

{% if dati.get('ticker_bg') == 'GRADIENTE_BLU' %}

    background:linear-gradient(
        90deg,
        #001f3f,
        #3498db
    );

{% elif dati.get('ticker_bg') == 'GRADIENTE_ROSSO' %}

    background:linear-gradient(
        90deg,
        #8b0000,
        #ff3333
    );

{% elif dati.get('ticker_bg') == 'GRADIENTE_VERDE' %}

    background:linear-gradient(
        90deg,
        #145a32,
        #2ecc71
    );

{% elif dati.get('ticker_bg') == 'NERO_ROSSO' %}

    background:linear-gradient(
        90deg,
        #000000,
        #c0392b
    );

{% else %}

    background:{{ dati.get('ticker_bg','#f39c12') }};

{% endif %}

}

.ticker{

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
}

.scritta{

    font-size:60px;

    font-weight:bold;

    color:{{ dati.get('ticker_fg','#000000') }};

}

</style>

</head>

<body>

<div class="ticker">

<marquee

behavior="scroll"

direction="left"

{% if dati.get('ticker_speed','20') == '10' %}
scrollamount="20"
{% elif dati.get('ticker_speed','20') == '30' %}
scrollamount="6"
{% else %}
scrollamount="12"
{% endif %}

class="scritta"

>

{{ dati.get('ticker') or 'NESSUN MESSAGGIO' }}

</marquee>

</div>

</body>

</html>
