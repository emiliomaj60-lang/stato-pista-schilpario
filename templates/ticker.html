<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial,sans-serif;
}

body{

{% if dati.get('ticker_bg') == 'GRADIENTE_BLU' %}

    background:linear-gradient(90deg,#001f3f,#3498db);

{% elif dati.get('ticker_bg') == 'GRADIENTE_ROSSO' %}

    background:linear-gradient(90deg,#8b0000,#ff3333);

{% elif dati.get('ticker_bg') == 'GRADIENTE_VERDE' %}

    background:linear-gradient(90deg,#145a32,#2ecc71);

{% elif dati.get('ticker_bg') == 'NERO_ROSSO' %}

    background:linear-gradient(90deg,#000000,#c0392b);

{% else %}

    background:{{ dati.get('ticker_bg','#f39c12') }};

{% endif %}

}

.ticker{

    width:100%;
    height:100%;

    overflow:hidden;

    position:relative;
}

.scritta{

    position:absolute;

    top:2px;

    left:0;

    white-space:nowrap;

    font-size:46px;

    font-weight:bold;

    color:{{ dati.get('ticker_fg','#000000') }};
}

</style>

</head>

<body>

<div class="ticker">

    <div id="scritta" class="scritta">

        {{ dati.get('ticker') or 'NESSUN MESSAGGIO' }}

    </div>

</div>

<script>

const scritta = document.getElementById("scritta");

let pos = window.innerWidth;

function anima(){

    pos -= 3;

    scritta.style.transform =
        `translateX(${pos}px)`;

    const larghezza = scritta.offsetWidth;

    if(pos < -larghezza){

        pos = window.innerWidth;
    }

    requestAnimationFrame(anima);
}

anima();

</script>

</body>

</html>
