<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial,sans-serif;
}

/* SFONDI */

body{

{% if dati.get('ticker_bg') == 'GRADIENTE_BLU' %}

    background:linear-gradient(
        90deg,
        #001f3f,
        #3498db
    );

{% elif dati.get('ticker_bg') == 'GRADIENTE_ROSSO' %}

    background:linear-gradient(
        90deg,
        #8b0000,
        #ff3333
    );

{% elif dati.get('ticker_bg') == 'GRADIENTE_VERDE' %}

    background:linear-gradient(
        90deg,
        #145a32,
        #2ecc71
    );

{% elif dati.get('ticker_bg') == 'NERO_ROSSO' %}

    background:linear-gradient(
        90deg,
        #000000,
        #c0392b
    );

{% else %}

    background:{{ dati.get('ticker_bg','#f39c12') }};

{% endif %}

}

.ticker{
    width:100%;
    height:100%;

    position:relative;

    overflow:hidden;
}

.testo{

    position:absolute;

    top:5px;
    left:0;

    font-size:36px;
    font-weight:bold;

    color:{{ dati.get('ticker_fg','#000000') }};

    padding-left:100%;

    animation:
        scorri var(--velocita) linear infinite;
}

.lampeggio{

    animation:
        scorri var(--velocita) linear infinite,
        blink 1s infinite;
}

.evidenziazione{

    animation:
        scorri var(--velocita) linear infinite,
        evidenzia 1s infinite;
}

/* SCORRIMENTO */

@keyframes scorri{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

/* LAMPEGGIO */

@keyframes blink{

    0%{
        opacity:1;
    }

    50%{
        opacity:0.3;
    }

    100%{
        opacity:1;
    }

}

/* EVIDENZIAZIONE */

@keyframes evidenzia{

    0%{
        filter:none;
    }

    50%{
        filter:brightness(180%);
    }

    100%{
        filter:none;
    }

}

</style>

</head>

<body>

<div
style="
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
font-size:36px;
font-weight:bold;
color:{{ dati.get('ticker_fg','#000000') }};
">

{{ dati.get('ticker','NESSUN TESTO') }}

</div>

</body>

</html>
