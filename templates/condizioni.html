<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0d1b2a;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    width:100%;
    display:flex;
    gap:3px;
    padding:3px;
    box-sizing:border-box;
}


.box{
    flex:1;
    height:85px;

    background:#1b263b;
    border-radius:6px;

    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}


.stato{
    background:#27ae60;
}

.chiusa{
    background:#c0392b;
}

.titolo{
    font-size:12px;
    font-weight:bold;
    color:#d7d7d7;
    margin-bottom:4px;
}

.valore{
    font-size:24px;
    font-weight:bold;
    line-height:1;
}

.data{
    font-size:11px;
    color:#c7d3df;
    margin-top:4px;
}

.note{
    background:#f39c12;
    color:black;

    font-size:24px;
    font-weight:bold;

    height:48px;
    line-height:48px;

    margin:2px 3px;

    border-radius:4px;

    text-align:center;

    animation: lampeggia 1.2s infinite;
}
@keyframes lampeggia{

    0%{
        background:#f39c12;
    }

    50%{
        background:#ffcc33;
    }

    100%{
        background:#f39c12;
    }

}
</style>

</head>

<body>

<div class="container">

    <div class="box {% if dati.stato_pattinaggio == 'CHIUSA' %}chiusa{% else %}stato{% endif %}">
        <div class="titolo">PISTA PATTINAGGIO</div>
        <div class="valore">{{ dati.stato_pattinaggio }}</div>
    </div>

    <div class="box {% if dati.stato == 'CHIUSA' %}chiusa{% else %}stato{% endif %}">
        <div class="titolo">PISTA FONDO</div>
        <div class="valore">{{ dati.stato }}</div>
    </div>

    <div class="box">
        <div class="titolo">KM APERTI</div>
        <div class="valore">{{ dati.km }}</div>
    </div>

    <div class="box">
        <div class="titolo">ARIA</div>
        <div class="valore">{{ dati.temperatura_aria }}°</div>
    </div>

    <div class="box">
        <div class="titolo">NEVE</div>
        <div class="valore">{{ dati.temperatura_neve }}°</div>
    </div>

    <div class="box">
        <div class="titolo">BATTITURA</div>
        <div class="valore">{{ dati.ultima_battitura }}</div>

        <div class="data">
            ({{ dati.data_battitura }})
        </div>
    </div>

</div>

{% if dati.note %}
<div class="note">
    {{ dati.note }}
</div>
{% endif %}

</body>

</html>
