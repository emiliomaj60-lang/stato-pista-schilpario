<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    margin:0;
    padding:0;
    background:#0d1b2a;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    width:630px;
    height:180px;
    display:flex;
    gap:4px;
    padding:4px;
    box-sizing:border-box;
}

.stato{
    width:130px;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    border-radius:8px;
}

.aperta{
    background:#27ae60;
}

.chiusa{
    background:#c0392b;
}

.card{
    flex:1;
    background:#1b263b;
    color:white;
    border-radius:8px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.label{
    font-size:11px;
    color:#c7d3df;
}

.valore{
    font-size:18px;
    font-weight:bold;
}

.note{
    display:none;
}

</style>
</head>

<body>

<div class="container">

    <div class="stato {% if dati.stato == 'APERTA' %}aperta{% else %}chiusa{% endif %}">
        {{ dati.stato }}
    </div>

    <div class="card">
        <div class="label">KM</div>
        <div class="valore">🚜 {{ dati.km }}</div>
    </div>

    <div class="card">
        <div class="label">ARIA</div>
        <div class="valore">🌡️ {{ dati.temperatura_aria }}°</div>
    </div>

    <div class="card">
        <div class="label">NEVE</div>
        <div class="valore">❄️ {{ dati.temperatura_neve }}°</div>
    </div>

    <div class="card">
        <div class="label">BATTITURA</div>
        <div class="valore">🕒 {{ dati.ultima_battitura }}</div>
    </div>

</div>

</body>
</html>
