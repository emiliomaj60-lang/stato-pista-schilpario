<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0d1b2a;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{

    width:100%;
    height:83px;

    display:flex;

    gap:3px;

    padding:2px;

    box-sizing:border-box;

    align-items:stretch;
}

.box{

    flex:1;

    height:79px;

    background:#1b263b;

    border-radius:6px;

    color:white;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    box-sizing:border-box;

    overflow:hidden;
}

.box-stato{
    flex:1.8;
}

.stato{
    background:#27ae60;
}

.chiusa{
    background:#c0392b;
}

.titolo{
    font-size:16px;
    font-weight:bold;
    color:#0F0808;
    margin-bottom:2px;
    white-space:nowrap;
}

.titolo2{
    font-size:18px;
    font-weight:bold;
    color:#EBC6C6;

    margin-bottom:4px;

    white-space:nowrap;
}

.titolo3{
    font-size:12px;
    font-weight:bold;
    color:#EBC6C6;

    margin-bottom:4px;

    white-space:nowrap;
}

.valore{
    font-size:28px;
    font-weight:bold;
    line-height:1;
}

.data{
    font-size:11px;
    color:#E6DDDA;
    margin-top:4px;
}

.data2{
    font-size:13px;
    color:#E6DDDA;
    margin-top:2px;
}


.note{
    background:#f39c12;
    color:black;

    font-size:20px;
    font-weight:bold;

    height:38px;
    line-height:38px;

    margin:2px 3px;

    border-radius:4px;

    text-align:center;

    animation: lampeggia 1.2s infinite;
}

@keyframes lampeggia{

    0%{
        background:#E2B875;
    }

    50%{
        background:#DDFF33;
    }

    100%{
        background:#F35512;
    }

}
.tabella-giornaliera th{
    background:#d9d9d9;
    font-weight:bold;
}

/* DEBUG */
*{
    outline:1px solid red;
}
</style>

</head>

<body>
<div style="
position:fixed;
top:10px;
left:10px;
background:red;
color:white;
padding:10px;
z-index:9999;
font-size:40px;
">
<script>
document.write(
window.innerWidth + " x " + window.innerHeight
);
</script>
</div>


<div class="container">

    <div class="box box-stato {% if dati.stato_pattinaggio == 'CHIUSA' %}chiusa{% else %}stato{% endif %}">
        <div class="titolo">PISTA PATTINAGGIO</div>
        <div class="valore">{{ dati.stato_pattinaggio }}</div>
    </div>

    <div class="box box-stato {% if dati.stato == 'CHIUSA' %}chiusa{% else %}stato{% endif %}">
        <div class="titolo">PISTA SCI FONDO</div>
        <div class="valore">{{ dati.stato }}</div>
    </div>

    <div class="box">
        <div class="titolo2">KM APERTI</div>
        <div class="valore">{{ dati.km }}</div>
    </div>

    <div class="box">
        <div class="titolo2">ARIA</div>
        <div class="valore">{{ dati.temperatura_aria }}</div>
    </div>

    <div class="box">
        <div class="titolo2">NEVE</div>
        <div class="valore">{{ dati.temperatura_neve }}</div>
    </div>

    <div class="box">
        <div class="titolo3">ULTIMA BATTITURA</div>
        <div class="valore">{{ dati.ultima_battitura }}</div>

        <div class="data2">
            ({{ dati.data_battitura }})
        </div>
    </div>

</div>

{% if dati.note %}
<div class="note">
    {{ dati.note }}
</div>
{% endif %}

</body>

</html>
