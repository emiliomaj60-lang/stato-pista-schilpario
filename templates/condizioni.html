<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    margin:0;
    background:#0d1b2a;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    padding:12px;
}

.stato{
    text-align:center;
    font-size:48px;
    font-weight:bold;
    padding:18px;
    border-radius:12px;
    margin-bottom:12px;
}

.aperta{
    background:#27ae60;
}

.chiusa{
    background:#c0392b;
}

.card{
    background:#1b263b;
    border-left:8px solid #3498db;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
}

.label{
    font-size:18px;
    color:#c7d3df;
}

.valore{
    font-size:42px;
    font-weight:bold;
    margin-top:4px;
}

.note{
    background:#f39c12;
    color:white;
    border-radius:12px;
    padding:12px;
    margin-top:10px;
}

.note .valore{
    font-size:26px;
}

</style>
</head>

<body>

<div class="barra">

<div class="box stato">
    ✅<br>
    {{ dati.stato }}
</div>

<div class="box">
    🚜<br>
    {{ dati.km }} km
</div>

<div class="box">
    🌡️<br>
    {{ dati.temperatura_aria }}°
</div>

<div class="box">
    ❄️<br>
    {{ dati.temperatura_neve }}°
</div>

<div class="box">
    🕒<br>
    {{ dati.ultima_battitura }}
</div>

</div>

</body>
</html>
