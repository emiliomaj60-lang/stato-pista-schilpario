<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#0d1b2a;

    font-family:Arial,sans-serif;

    overflow:hidden;
}

.tabella{

    width:100%;

    border-spacing:3px;

    table-layout:fixed;

    padding:2px;

    box-sizing:border-box;
}

.tabella td{

    text-align:center;

    vertical-align:middle;

    height:79px;

    border-radius:6px;

    overflow:hidden;
}

.box{

    background:#1b263b;

    color:white;
}

.box-stato{

    width:22%;

    color:white;
}

.stato{

    background:#27ae60;
}

.chiusa{

    background:#c0392b;
}

.titolo{

    font-size:16px;

    font-weight:bold;

    color:#0F0808;

    margin-bottom:2px;

    white-space:nowrap;
}

.titolo2{

    font-size:16px;

    font-weight:bold;

    color:#EBC6C6;

    white-space:nowrap;
}

.titolo3{

    font-size:12px;

    font-weight:bold;

    color:#EBC6C6;

    white-space:nowrap;
}

.valore{

    font-size:28px;

    font-weight:bold;
}

.data2{

    font-size:13px;

    color:#E6DDDA;
}

.note{

    background:#f39c12;

    color:black;

    font-size:20px;

    font-weight:bold;

    height:38px;

    line-height:38px;

    margin:2px 3px;

    border-radius:4px;

    text-align:center;
}

</style>

</head>

<body>

<table class="tabella">

<tr>

<td class="box-stato {% if dati.stato_pattinaggio == 'CHIUSA' %}chiusa{% else %}stato{% endif %}">
    <div class="titolo">PISTA PATTINAGGIO</div>
    <div class="valore">{{ dati.stato_pattinaggio }}</div>
</td>

<td class="box-stato {% if dati.stato == 'CHIUSA' %}chiusa{% else %}stato{% endif %}">
    <div class="titolo">PISTA SCI FONDO</div>
    <div class="valore">{{ dati.stato }}</div>
</td>

<td class="box">
    <div class="titolo2">KM APERTI</div>
    <div class="valore">{{ dati.km }}</div>
</td>

<td class="box">
    <div class="titolo2">ARIA</div>
    <div class="valore">{{ dati.temperatura_aria }}</div>
</td>

<td class="box">
    <div class="titolo2">NEVE</div>
    <div class="valore">{{ dati.temperatura_neve }}</div>
</td>

<td class="box">
    <div class="titolo3">ULTIMA BATTITURA</div>
    <div class="valore">{{ dati.ultima_battitura }}</div>
    <div class="data2">
        ({{ dati.data_battitura }})
    </div>
</td>

</tr>

</table>

{% if dati.note %}
<div class="note">
    {{ dati.note }}
</div>
{% endif %}

</body>

</html>
