<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0d1b2a;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    width:100%;
    height:180px;
    display:flex;
    gap:3px;
    padding:3px;
    box-sizing:border-box;
}

.box{
    flex:1;
    background:#1b263b;
    border-radius:6px;
    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.stato{
    background:#27ae60;
}

.chiusa{
    background:#c0392b;
}

.titolo{
    font-size:14px;
    font-weight:bold;
    color:#d7d7d7;
    margin-bottom:6px;
    text-transform:uppercase;
}

.valore{
    font-size:28px;
    font-weight:bold;
    line-height:1;
}

.data{
    font-size:11px;
    color:#c7d3df;
    margin-top:4px;
}

.note{
    background:#f39c12;
    color:white;
    font-size:13px;
    font-weight:bold;
    text-align:center;
    padding:6px;
    margin:3px;
    border-radius:6px;
}

</style>

</head>

<body>

<div class="container">

    <div class="box {% if dati.stato == 'CHIUSA' %}chiusa{% else %}stato{% endif %}">
        <div class="titolo">PISTA</div>
        <div class="valore">{{ dati.stato }}</div>
    </div>

    <div class="box">
        <div class="titolo">KM APERTI</div>
        <div class="valore">{{ dati.km }}</div>
    </div>

    <div class="box">
        <div class="titolo">ARIA</div>
        <div class="valore">{{ dati.temperatura_aria }}°</div>
    </div>

    <div class="box">
        <div class="titolo">NEVE</div>
        <div class="valore">{{ dati.temperatura_neve }}°</div>
    </div>

    <div class="box">
        <div class="titolo">BATTITURA</div>
        <div class="valore">{{ dati.ultima_battitura }}</div>
        <div class="data">
            ({{ dati.data_battitura }})
        </div>
    </div>

</div>

{% if dati.note %}
<div class="note">
    {{ dati.note }}
</div>
{% endif %}

</body>

</html>
