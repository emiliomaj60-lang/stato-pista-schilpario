<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="30">

<style>

body{
    margin:0;
    background:#0d1b2a;
    font-family:Arial, sans-serif;
    color:white;
}

.container{
    padding:15px;
}

.stato{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.aperta{
    background:#2ecc71;
}

.chiusa{
    background:#e74c3c;
}

.card{
    background:#1b263b;
    border-left:6px solid #3498db;
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
}

.label{
    font-size:18px;
    color:#bfc9d9;
}

.valore{
    font-size:32px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

    <div class="stato {% if dati.stato == 'APERTA' %}aperta{% else %}chiusa{% endif %}">
        {{ dati.stato }}
    </div>

    <div class="card">
        <div class="label">KM APERTI</div>
        <div class="valore">🚜 {{ dati.km }}</div>
    </div>

    <div class="card">
        <div class="label">TEMPERATURA ARIA</div>
        <div class="valore">🌡️ {{ dati.temperatura_aria }} °C</div>
    </div>

    <div class="card">
        <div class="label">TEMPERATURA NEVE</div>
        <div class="valore">❄️ {{ dati.temperatura_neve }} °C</div>
    </div>

    <div class="card">
        <div class="label">ULTIMA BATTITURA</div>
        <div class="valore">🕒 {{ dati.ultima_battitura }}</div>
    </div>

</div>

</body>
</html>
