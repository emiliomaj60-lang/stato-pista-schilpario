<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0d1b2a;
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:2px;
    padding:2px;
    box-sizing:border-box;
}

.box{
    flex:1;
    height:96%;
    background:#1b263b;
    border-radius:4px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
}

.stato{
    background:#27ae60;
}

.chiusa{
    background:#c0392b;
}

.titolo{
    font-size:9px;
    color:#d0d0d0;
    margin-bottom:2px;
    text-transform:uppercase;
}

.valore{
    font-size:13px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

    <div class="box {% if dati.stato == 'CHIUSA' %}chiusa{% else %}stato{% endif %}">
        <div class="titolo">PISTA</div>
        <div class="valore">{{ dati.stato }}</div>
    </div>

    <div class="box">
        <div class="titolo">KM</div>
        <div class="valore">{{ dati.km }}</div>
    </div>

    <div class="box">
        <div class="titolo">ARIA</div>
        <div class="valore">{{ dati.temperatura_aria }}°</div>
    </div>

    <div class="box">
        <div class="titolo">NEVE</div>
        <div class="valore">{{ dati.temperatura_neve }}°</div>
    </div>

    <div class="box">
        <div class="titolo">BATT.</div>
        <div class="valore">{{ dati.ultima_battitura }}</div>
    </div>

</div>

</body>
</html>
