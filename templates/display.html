<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
body{
    background:#0d1b2a;
    color:white;
    font-family:Arial;
    text-align:center;
    margin-top:50px;
}

.stato{
    font-size:60px;
    font-weight:bold;
}

.km{
    font-size:40px;
    margin-top:20px;
}

.note{
    font-size:30px;
    margin-top:20px;
    color:#f1c40f;
}
</style>
</head>

<body>

<div class="stato">
    {{ dati.stato }}
</div>

<div class="km">
    KM APERTI: {{ dati.km }}
</div>

<div class="km">
    🌡️ ARIA: {{ dati.temperatura_aria }} °C
</div>

<div class="km">
    ❄️ NEVE: {{ dati.temperatura_neve }} °C
</div>

<div class="km">
    🚜 ULTIMA BATTITURA:
    {{ dati.ultima_battitura }}
</div>

<div class="note">
    {{ dati.note }}
</div>

</body>
</html>
