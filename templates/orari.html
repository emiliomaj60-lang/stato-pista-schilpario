<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0d1b2a;
    font-family:Arial,sans-serif;
    color:white;
}

.container{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.stato{
    font-size:46px;
    font-weight:bold;
    padding:12px 30px;
    border-radius:12px;
    margin-bottom:20px;
}

.aperta{
    background:#27ae60;
}

.chiusa{
    background:#c0392b;
}

.titolo{
    font-size:22px;
    color:#d7d7d7;
    margin-bottom:10px;
}

.orario{
    font-size:56px;
    font-weight:bold;
}

.sottotitolo{
    margin-top:15px;
    font-size:20px;
    color:#c7d3df;
}

</style>

</head>

<body>

<div class="container">

    <div class="stato {% if dati.stato == 'APERTA' %}aperta{% else %}chiusa{% endif %}">
        {{ dati.stato }}
    </div>

    <div class="titolo">
        ORARIO PISTA
    </div>

    <div class="orario">
        {{ dati.ora_apertura }}
        -
        {{ dati.ora_chiusura }}
    </div>

    <div class="sottotitolo">
        Centro Fondo Schilpario
    </div>

</div>

</body>

</html>
