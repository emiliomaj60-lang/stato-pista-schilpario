<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;

    background:#0d1b2a;
    color:white;
    font-family:Arial,sans-serif;

    overflow:hidden;
}

.container{

    width:100%;
    height:131px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}

.titolo{
    font-size:14px;
    font-weight:bold;
    color:#d7d7d7;

    margin-bottom:8px;
}

.orario{
    font-size:34px;
    font-weight:bold;

    line-height:1;
}

.sottotitolo{
    margin-top:8px;

    font-size:12px;

    color:#c7d3df;
}

</style>

</head>

<body>

<div class="container">

    <div class="titolo">
        ORARIO PISTA
    </div>

    <div class="orario">
        {{ dati.ora_apertura }} - {{ dati.ora_chiusura }}
    </div>

    <div class="sottotitolo">
        Centro Fondo Schilpario
    </div>

</div>

</body>

</html>
